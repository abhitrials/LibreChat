version: 1.1.5
cache: true
endpoints:
  custom:
    # 1. Keep OpenRouter for your other models (like GLM 4.7)
    - name: "OpenRouter"
      apiKey: "${OPENROUTER_KEY}"
      baseURL: "https://openrouter.ai/api/v1"
      models:
        default: ["openrouter/auto"]
        fetch: true
        
    # 2. NEW: Direct connection to Aion Labs!
    - name: "Aion Labs"
      apiKey: "${AION_API_KEY}"
      baseURL: "https://api.aionlabs.ai/v1" 
      models:
        default: 
          - "aion-labs/aion-2.0"
          - "aion-labs/aion-2.5"
          - "aion-labs/aion-3.0"
          - "aion-labs/aion-3.0-mini"
        fetch: false

summarization:
  model: 'openrouter/auto'

memory:
  disabled: true

mcpServers:
  supabase-memory:
    type: sse
    url: "https://librechat-memory-api.onrender.com/sse"
    chatMenu: false
