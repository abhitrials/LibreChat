version: 1.1.5
cache: true
endpoints:
  custom:
    # 1. OpenRouter (Routed through your custom Proxy!)
    - name: "OpenRouter"
      apiKey: "${OPENROUTER_KEY}"
      baseURL: "https://librechat-memory-api.onrender.com/v1"
      models:
        default:
          - "meta-llama/llama-3.3-70b-instruct:nitro"
          - "meta-llama/llama-3.3-70b-instruct"
          - "z-ai/glm-5.2"
          - "openrouter/auto"
        fetch: true

    # 2. Aion Labs via Interceptor Proxy
    - name: "Aion Labs"
      apiKey: "${AION_API_KEY}"
      baseURL: "https://librechat-memory-api.onrender.com/v1"
      models:
        default:
          - "aion-labs/aion-2.0"
          - "aion-labs/aion-2.5"
          - "aion-labs/aion-3.0"
          - "aion-labs/aion-3.0-mini"
        fetch: false

    # 3. Abliteration AI (Routed through your custom Proxy!)
    - name: "AbliterationAI"
      apiKey: "${ABLITERATION_API_KEY}"
      baseURL: "https://librechat-memory-api.onrender.com/v1"
      models:
        default:
          - "abliterated-model-large"
        fetch: false
      titleConvo: true
      modelDisplayLabel: "GLM 5.2"

    # 4. Novita AI (Routed through your custom Proxy!)
    - name: "Novita AI"
      apiKey: "${NOVITA_API_KEY}"
      baseURL: "https://librechat-memory-api.onrender.com/v1"
      models:
        fetch: true

summarization:
  model: "openrouter/auto"

memory:
  disabled: true

mcpServers:
  supabase-memory:
    type: sse
    url: "https://librechat-memory-api.onrender.com/sse"
    chatMenu: false
